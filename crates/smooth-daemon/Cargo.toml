[package]
name = "smooai-smooth-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Big Smooth, reborn — the always-on, single-tenant personal-agent daemon on smooth-operator (EPIC th-c89c2a)"

[lib]
name = "smooth_daemon"

# The always-on daemon binary — Big Smooth. Runnable standalone
# (`smooth-daemon`); `th daemon` is a passthrough to it and `th up` launches it.
# Deliberately NOT linked into `th`: most users install the CLI for
# api/jira/pearls/config and shouldn't pay for axum + the engine + the widget
# bundle (see crates/smooth-cli/src/daemon_launcher.rs).
[[bin]]
name = "smooth-daemon"
path = "src/main.rs"

# th-f30175: the always-on daemon replaced smooth-bigsmooth (deleted with the
# microVM stack, 2026-07/th-f4a801). It runs on the smooth-operator engine, with
# security from a kernel OS-sandbox + egress proxy + the engine's permission
# hook rather than a microVM substrate.
[dependencies]
smooth-operator.workspace = true
# EPIC th-c89c2a: the OPERATOR (local deployment flavor) embedded in-process —
# the daemon hosts smooth-operator's LocalServer (canonical WS protocol +
# official widget + SDK clients) instead of the bespoke /ws. Lean (no cloud).
smooth-operator-server.workspace = true
smooth-operator-svc.workspace = true
smooth-tools.workspace = true
# th-daemon-skills: skill discovery + the normalized `Skill` type. smooth-cast is
# lean (smooth-operator + smooth-policy + serde/yaml/dirs — all already in this
# crate's tree, no TUI/ratatui), so the daemon reuses its canonical skills
# catalog directly rather than re-implementing discovery.
smooth-cast.workspace = true
# EPIC th-c89c2a (th-a28904): the daemon serves the smooth-web SPA same-origin at
# its own `http://127.0.0.1:8787/` (token injected into index.html) instead of the
# operator's stock widget — so the control surface is reachable with no
# `?api`/`?token` query string.
smooth-web.workspace = true
smooth-policy.workspace = true
# th-08e05a (EPIC th-c89c2a): the egress boundary — the daemon starts goalie's
# in-process forward proxy (exact-host allowlist) and routes the bash tool's
# network through it.
smooth-goalie.workspace = true
# surface) via rust-embed.
# th-bd0e22 (EPIC th-c89c2a): durable persistence for the daemon's per-instance
# runtime state (events, sessions). SQLite (not Dolt) — this is ephemeral local
# state, not team-synced work items; rusqlite is bundled (no external binary).
rusqlite.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
tokio-stream.workspace = true
# rustls feature: the workspace pin carries NO TLS (loopback-only elsewhere);
# the relay client dials wss://relay.smoo.ai, which needs it (smooth-cli precedent).
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
dirs-next.workspace = true
# The standalone `smooth-daemon` binary owns the full daemon CLI (run / operator
# / status / audit / schedule), so the `th` CLI can stay lean and just
# spawn this binary rather than statically linking the operator runtime.
clap = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["json"] }
# th-bc624a: "Sign in with Smoo" browser OAuth2 + PKCE from the web UI. Persists a
# user session via smooai-client-shared's CredentialsStore (the same file `th`
# reads), so Big Smooth can act on the user's Smoo org via th-backed extensions.
smooai-client-shared.workspace = true
base64 = "0.22"
# /search pearl suggestions (th-8e9cf6) — open the project/global Dolt store
smooth-pearls.workspace = true
sha2 = "0.10"
rand = "0.8"
# th-3119e3: re-homed narc surveillance detectors (secret + prompt-injection
# regexes) run in-process as a ToolHook on the operator's registry.
regex = "1"
# th-5c0189: `secret_file::write_secret` writes tokens/keys through a
# NamedTempFile so they are 0600 from creation, with no world-readable
# window between `fs::write` and `chmod`.
tempfile.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Real end-to-end WebSocket smoke tests against the daemon's axum server.
tokio-tungstenite.workspace = true
futures-util.workspace = true
# Temp DBs for the SQLite persistence tests.
tempfile.workspace = true
# `ServiceExt::oneshot` for router-level auth-middleware tests.
tower = { workspace = true, features = ["util"] }
# Collect response bodies in the `/search` router tests.
http-body-util.workspace = true

[lints]
workspace = true

[target.'cfg(target_os="macos")'.dependencies]
# Menu bar lives in the quarantined crate (it needs `unsafe` for AppKit); the
# daemon only depends on it on macOS. Pearl th-f7cb98.
smooth-menubar = { workspace = true }

[target.'cfg(not(target_os="windows"))'.dependencies]
# Web Push. NOT on Windows: web-push -> ece hard-depends on `openssl` (ece 2.x
# has no pure-Rust backend), and a stock Windows host has no OpenSSL — no vcpkg
# tree, no OPENSSL_DIR. That single leaf dependency is why this whole crate was
# `--exclude`d from the Windows CI lane, i.e. why the entire daemon was
# unbuildable there. Scoping it off Windows costs one feature (phone
# notifications) and buys the agent engine. `push::PushState::send_to_all` is
# cfg'd to a no-op and `/push/*` 503s there. Pearl th-a59af5.
web-push = "0.11"
# VAPID keypair generation for Web Push (auto-provisioned on first run when no
# SMOOTH_VAPID_* env is set). Pure-Rust P-256; only used off Windows, where push
# is disabled anyway. Pearl th-c561f1.
p256 = "0.13"
