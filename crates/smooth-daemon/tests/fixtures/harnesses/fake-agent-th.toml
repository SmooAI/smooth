# fake-agent-th — the hooks flavour, but every hook goes through the native
# `th flow hook fake-agent-th <Event>` (pearl th-f97a27) instead of fake-agent
# posting itself: the path a real harness takes through the smooth-agent
# plugin. The e2e rig links the `th` under test into ~/.local/bin.
name = "fake-agent-th"
display_name = "Fake Agent (th flow hook)"

[binary]
names = ["fake-agent"]
prefer_paths = [".local/bin/fake-agent"]

[launch]
argv = ["--session-id", "{session_id}", "--model", "{model}", "{prompt}"]
prompt_as = "argv"
session_id = "preassigned"

[launch.env]
FAKE_AGENT_MODE = "hooks"
FAKE_AGENT_HOOK_VIA = "th"
FAKE_AGENT_HARNESS = "fake-agent-th"

[resume]
argv = ["--resume", "{session_id}"]
mode = "resume_session"

[state]
source = "hooks"

[state.hooks]
install = "none — fake-agent runs `th flow hook` itself"

[state.scrape]
working = ["esc to interrupt"]
idle = ["(?m)^> ?$"]
needs_you = ["do you want to proceed"]
usage_limit = ["usage limit", "limit will reset"]

[steer]
method = "bracketed_paste"
submit_key = "Enter"

[kill]
signal = "TERM"
grace_ms = 1000
