[package]
name = "smooai-smooth-policy"
# Internal crate — part of the `th` binary, not a public library.
# `th` ships as a GitHub binary release; only smooai-smooth-operator-core
# is published to crates.io (separately, as its own crate). Pearl th-607f69.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Smooth policy types — TOML-based access control for Smooth operatives"
readme = "README.md"
keywords = ["policy", "access-control", "toml", "security", "ai-agents"]
categories = ["config", "authentication"]

[lib]
name = "smooth_policy"

[dependencies]
serde.workspace = true
toml.workspace = true
globset.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
sha2 = "0.10"
dirs-next.workspace = true
# th-16b0ca: `auth_paths` reads the stored session JSON to name a migrated
# profile after its user's email.
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
