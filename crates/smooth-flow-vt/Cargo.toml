[package]
name = "smooai-smooth-flow-vt"
# Internal crate — the SmoothFlow session host's headless terminal.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless libghostty-vt for the SmoothFlow session host: feed, scrape, bounded VT snapshots, key and paste encoding (th-5025fb, ADR-011)"
build = "build.rs"

[lib]
name = "smooth_flow_vt"

[dependencies]
thiserror.workspace = true

# build.rs runs scripts/ghostty-vt/build-ghostty-vt.sh (the pinned Zig build
# SmoothFlow Desktop shares) and compiles the C bridge in csrc/.
[build-dependencies]
cc = "1"

# NOT `[lints] workspace = true`: the workspace FORBIDS unsafe_code, and a
# forbid cannot be relaxed further down. This copies the workspace lints with
# unsafe_code lowered to "deny", so exactly one module — src/ffi.rs, the
# extern declarations and their safe wrappers — can `#![allow(unsafe_code)]`.
# Every other module in the crate still fails to compile with `unsafe`. Keep
# the rest in step with [workspace.lints] in the root Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
double_must_use = "allow"
doc_markdown = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"

[dev-dependencies]
# tests.rs reads every shipped harness manifest's key names.
toml.workspace = true
