[package]
name = "smooai-smooth-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reusable agent tools (filesystem, grep, bash) with workspace-scoped paths, for the smooth-daemon (EPIC th-c89c2a)"

[lib]
name = "smooth_tools"

# th-ed6604: the core agent tools as a lib any host can register on a
# ToolRegistry — today that's the smooth-daemon. The workspace-path scoping
# (path.rs) and the kernel OS sandbox (sandbox.rs) are security-critical and
# exhaustively tested here.
[dependencies]
smooth-operator.workspace = true
smooth-policy.workspace = true
dirs-next.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# th-daemon-skills: the `create_skill` tool serializes SKILL.md YAML frontmatter
# with serde_yml (the same parser the skills catalog reads back), so escaping is
# correct for descriptions/triggers containing YAML metacharacters.
serde_yml.workspace = true
# th-262e5f: CLI-wrapper plugin manifests (`plugin.toml`).
toml.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
ignore.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
tracing.workspace = true
# th-4c6271: the `current_datetime` tool. chrono formats it; iana-time-zone
# (already in the tree via chrono) supplies the cross-platform IANA zone NAME,
# which chrono::Local alone does not know (it only carries the numeric offset).
chrono.workspace = true
iana-time-zone = "0.1"
# th-7031ba: `web_search` is self-contained — it calls public search APIs
# (Brave / SearXNG / DuckDuckGo / Wikipedia) in-process instead of shelling
# `th search`, which needed Smoo auth + api.smoo.ai. smooai-fetch is the house
# resilient client (retries/timeout/backoff); urlencoding builds query strings.
smooai-fetch.workspace = true
urlencoding.workspace = true

# th-1665ed: the `imessage` tool reads ~/Library/Messages/chat.db over a
# READ-ONLY rusqlite connection, in-process by design — a `sqlite3` subprocess
# would have to cross the kernel sandbox, which denies ~/Library outright.
# macOS-only, like the tool itself, so no other platform pays for the bundled
# SQLite build.
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite.workspace = true
# th-94cc4a (reminders slice): the `reminders` tool calls EventKit in-process.
# All the objc2 FFI lives in smooth-menubar, the workspace's macOS quarantine
# crate (the only one that may use `unsafe`) — this crate stays `forbid`.
smooth-menubar.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# th-daemon-skills: round-trip test — a SKILL.md written by `create_skill` must
# parse back cleanly through the canonical skills parser.
smooth-cast.workspace = true

[lints]
workspace = true
