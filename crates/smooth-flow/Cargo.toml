[package]
name = "smooai-smooth-flow"
# Internal crate — hosted by smooth-daemon, not a public library.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SmoothFlow engine — agent/shell sessions under tmux, PTY streaming, supervision, fan-out (epic th-6ac036)"

[lib]
name = "smooth_flow"

[dependencies]
smooth-tmux.workspace = true
rusqlite.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs-next.workspace = true
base64 = "0.22"
regex = "1"
# th-91d032: per-launch hook tokens (OS randomness; only the SHA-256 is stored).
rand = "0.8"
sha2 = "0.10"
toml.workspace = true
# th-145e6b: the repo index walks $HOME with fd's parallel walker.
ignore.workspace = true
# th-51bf88: the harness doctor reads Codex's config.toml hook-trust table.
toml_edit.workspace = true
# PTY for streaming a `tmux attach` client's bytes to flow WS clients. Pinned:
# the master/child API moved between minors before 0.9.
portable-pty = "=0.9.0"
# th-473294: the harness validator runs a PRIVATE engine (scratch $HOME +
# worktree + flow.db) so a draft manifest never touches the user's state.
tempfile.workspace = true
# th-26f5b9 (SmoothFlow Diff): word-level change spans inside paired lines.
similar.workspace = true
# th-26f5b9: server-side syntax spans. syntect's parser on the pure-Rust
# fancy-regex engine (no Oniguruma C build), over bat's ~200-syntax set from
# two-face (TypeScript/TSX, Swift, Kotlin, TOML — which syntect's own default
# set lacks). No theme dumps: clients theme the token kinds. ~1.3 MB in a
# stripped release binary.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

# th-5025fb (ADR-011): the session host's headless libghostty-vt. Optional,
# behind `pty-host`, until PtyHost lands (th-dc9822): the crate builds
# libghostty-vt with a pinned Zig, and nothing that builds smooth-flow today
# (the daemon, `th`, their release builds) should need that before it is used.
smooth-flow-vt = { workspace = true, optional = true }

# th-e4aef9: the session host's error types.
thiserror.workspace = true

# th-e4aef9: the session host (behind `pty-host`): setsid, umask, the peer's
# uid on its socket, waitpid for the child's exact status, killpg for a tree
# kill — all safe wrappers, since the workspace forbids `unsafe`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "process", "signal", "socket", "user"], optional = true }

[target.'cfg(windows)'.dependencies]
# th-64d4ab: process liveness and start time without `ps`.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[features]
# th-5025fb: the engine-owned PTY session host (ADR-011). Pulls in
# smooth-flow-vt and with it the libghostty-vt build. Off by default for now.
pty-host = ["dep:smooth-flow-vt", "dep:nix"]
# th-8b3918: expose `host::fake::FakeHost` (the in-memory session host) to
# other crates' tests. Never enabled in a shipped build.
test-util = []

# The session host as its own binary, only for this crate's integration
# tests (they can't build smooth-daemon, whose `flow-host` subcommand is what
# ships). th-e4aef9.
[[bin]]
name = "smooth-flow-host"
path = "src/bin/smooth-flow-host.rs"
required-features = ["pty-host"]

[[test]]
name = "session_host"
path = "tests/session_host.rs"
required-features = ["pty-host"]

[lints]
workspace = true
