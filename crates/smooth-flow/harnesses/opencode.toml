# OpenCode (th-5c5457 / th-b423aa): the positional is its project dir, so the
# prompt goes through --prompt; the session id is learned from the plugin's
# first hook by cwd; resume is --session <id>.
name = "opencode"
display_name = "OpenCode"

[binary]
names = ["opencode"]
prefer_paths = [".opencode/bin/opencode", ".local/bin/opencode"]
skip_path_patterns = ["cmux-cli-shims"]

[launch]
argv = ["--model", "{model}", "--prompt", "{prompt}"]
prompt_as = "argv"
session_id = "learned"

[resume]
argv = ["--session", "{session_id}"]
mode = "resume_session"

[state]
source = "hooks"

[state.hooks]
install = "th harness enable opencode  # smooth-agent lifecycle plugin posts session.* and permission/question events to /api/flow/hooks"
# The plugin only observes the bus: there is no hook to hold open.
hold_permission = false

[state.scrape]
# Captured live 2026-09-08: the status line carries "esc interrupt" while the
# model streams; idle shows the cwd + "ctrl+p commands" (a long cwd wraps it,
# so match the key only).
working = ["esc interrupt"]
idle = ["ctrl\\+p"]
needs_you = ["do you want to proceed", "1\\. yes"]
usage_limit = ["usage limit reached", "approaching usage limit", "limit will reset", "limit resets at", "out of credits"]
error = ["api error", "fatal error", "request failed"]

# SMOODEV-4268: for a plugin older than this, or one not installed. Captured live
# from OpenCode 1.18.30.
[[state.scrape.rules]]
name = "opencode-permission"
state = "needs_you"
reason = "permission"
match = ["permission required", "allow once\\s+allow always"]

[[state.scrape.rules]]
name = "opencode-question"
state = "needs_you"
reason = "question"
match = ["enter submit\\s+esc dismiss"]

[steer]
method = "bracketed_paste"
submit_key = "Enter"
# "Allow once" is selected first; Esc rejects.
approve_keys = ["Enter"]
allow_session_keys = ["Enter"]
deny_keys = ["Escape"]

[kill]
signal = "TERM"
grace_ms = 3000

[install]
skills_dir = "~/.opencode/skills"
mcp_config = "~/.config/opencode/opencode.json"
