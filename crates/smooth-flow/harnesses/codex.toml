# Codex CLI (th-5c5457): positional prompt; the session id is learned from a
# hook by cwd once ~/.codex/hooks.json posts (pearl th-4ad334) — until then
# state is scraped; resume is `codex resume <id>`.
name = "codex"
display_name = "Codex"

[binary]
names = ["codex"]
prefer_paths = [".local/bin/codex"]
skip_path_patterns = ["cmux-cli-shims"]

[launch]
argv = ["--model", "{model}", "{prompt}"]
prompt_as = "argv"
session_id = "learned"

[resume]
argv = ["resume", "{session_id}"]
mode = "resume_session"

[state]
source = "hooks"

[state.hooks]
install = "th harness enable codex  # wires `th flow hook` into ~/.codex/hooks.json (Codex 0.153+)"
# Codex runs PermissionRequest BEFORE it draws the prompt, so holding the hook
# open hides the prompt ("Running hook"). Reply at once; approval is by key.
hold_permission = false

[state.scrape]
working = ["esc to interrupt", "esc to cancel", "\\(running", "tokens · esc"]
idle = ["\\? for shortcuts", "for shortcuts", "shift\\+tab to cycle", "> "]
# Codex menus (trust this directory / hooks need review): "› 1. …" + this footer.
needs_you = ["do you want to proceed", "do you want to make this edit", "❯ 1\\. yes", "1\\. yes", "would you like to proceed", "press enter to confirm"]
usage_limit = ["usage limit reached", "approaching usage limit", "limit will reset", "limit resets at", "out of credits"]
error = ["api error", "fatal error", "request failed", "execution error"]

# SMOODEV-4268: rules run before the flat lists: the approval footer says "esc to
# cancel", which the flat `working` list reads as busy. Captured live from Codex
# 0.162.0.
[[state.scrape.rules]]
name = "codex-approval"
state = "needs_you"
reason = "permission"
match = ["would you like to run the following command", "would you like to make the following edits", "press enter to confirm or esc to cancel"]
unless_below = ["for shortcuts", "esc to interrupt"]

# Trust folder, hooks review: answered in the pane, not by the approval keys.
[[state.scrape.rules]]
name = "codex-dialog"
state = "needs_you"
reason = "question"
match = ["enter continue · esc back", "enter confirm · esc skip", "t trust · esc back"]

[steer]
method = "bracketed_paste"
submit_key = "Enter"
# "1. Yes, proceed (y)", "2. Yes, and don't ask again (p)", "3. No (esc)".
approve_keys = ["y"]
allow_session_keys = ["p"]
deny_keys = ["Escape"]

[kill]
signal = "TERM"
grace_ms = 3000

[install]
skills_dir = "~/.codex/skills"
mcp_config = "~/.codex/config.toml"
