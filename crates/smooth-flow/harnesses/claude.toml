# Claude Code — the reference harness (th-0f6126). Byte-for-byte the launch
# table the engine had hard-coded before manifests (th-5c5457).
name = "claude"
display_name = "Claude Code"

[binary]
names = ["claude"]
# `which claude` on a cmux machine is cmux's shim (injects its own
# --session-id + hooks); these real installs win before PATH.
prefer_paths = [".claude/local/claude", ".local/bin/claude"]
skip_path_patterns = ["cmux-cli-shims"]

[launch]
# argv after the resolved binary. An element whose placeholder is empty is
# dropped, together with the bare flag right before it.
argv = ["--session-id", "{session_id}", "--model", "{model}", "{prompt}"]
prompt_as = "argv"
session_id = "preassigned"

[resume]
argv = ["--resume", "{session_id}"]
mode = "resume_session"

[state]
source = "hooks"

[state.hooks]
install = "th harness enable claude-code  # smooth-agent plugin → `th flow hook` posts every event to /api/flow/hooks"
# event_map omitted ⇒ the Claude Code table (UserPromptSubmit/PreToolUse/PostToolUse → working,
# Stop → idle, PermissionRequest/Notification(permission|question) → needs_you, SessionEnd → ended).

[state.scrape]
working = ["esc to interrupt", "esc to cancel", "\\(running", "tokens · esc"]
idle = ["\\? for shortcuts", "for shortcuts", "shift\\+tab to cycle", "> "]
needs_you = ["do you want to proceed", "do you want to make this edit", "❯ 1\\. yes", "1\\. yes", "would you like to proceed"]
usage_limit = ["usage limit reached", "approaching usage limit", "limit will reset", "limit resets at", "out of credits"]
error = ["api error", "fatal error", "request failed", "execution error"]

# SMOODEV-4268: rules run before the flat lists, and every prompt below carries
# an "Esc to cancel" footer that the flat `working` list reads as busy. Captured
# live from Claude Code 2.1.318.
[[state.scrape.rules]]
name = "claude-approval"
state = "needs_you"
reason = "permission"
match = ["do you want to proceed\\?", "do you want to make this edit", "do you want to create ", "would you like to proceed", "^\\s*❯ 1\\. yes"]
unless_below = ["for shortcuts", "shift\\+tab to cycle", "esc to interrupt"]

# AskUserQuestion, with no hooks to say so.
[[state.scrape.rules]]
name = "claude-question"
state = "needs_you"
reason = "question"
match = ["enter to select .*esc to cancel"]
unless_below = ["for shortcuts", "shift\\+tab to cycle", "esc to interrupt"]

# Trust folder, API key, mode notices. Answered in the pane: the trust dialog's
# first option is "No, exit", so approval keys must not be offered.
[[state.scrape.rules]]
name = "claude-dialog"
state = "needs_you"
reason = "question"
match = ["enter to (confirm|continue) · esc to cancel", "do you want to use this api key", "yes, i trust this folder"]

[steer]
method = "bracketed_paste"
submit_key = "Enter"

[kill]
signal = "TERM"
grace_ms = 3000

[install]
skills_dir = "~/.claude/skills"
rules_dir = "~/.claude/rules"
mcp_config = "~/.claude.json"
