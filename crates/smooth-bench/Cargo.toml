[package]
name = "smooai-smooth-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Smooth benchmark harness — runs Aider Polyglot / SWE-bench / Terminal-Bench against the current routing config. Internal tool; not shipped in the `th` binary."

[[bin]]
name = "smooth-bench"
path = "src/main.rs"

[lib]
name = "smooth_bench"
path = "src/lib.rs"

[dependencies]
# The `--surface thcode` driver reuses smooth-code's OWN client codepath
# rather than re-implementing it, so the bench exercises what `th code`
# actually runs.
smooth-code = { workspace = true }
smooth-cast.workspace = true
# For llm_params::AGENT_TEMPERATURE — the driver and judge are LLM calls too,
# so a strict --judge-model would 400 on a hardcoded temperature (th-c127d1).
smooth-policy.workspace = true
smooth-operator.workspace = true
smooth-pearls = { path = "../smooth-pearls", package = "smooai-smooth-pearls" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
dirs-next.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
uuid.workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio.workspace = true
# Used by auto_approve tests to stand a fake Big Smooth.
axum.workspace = true

[lints]
workspace = true
