# Frontend build-and-judge scenarios (pearl th-f39abc).
#
# WHY THIS SUITE EXISTS
#
# The well-known coding benchmarks — HumanEval, MBPP, SWE-bench, MATH,
# LiveCodeBench, the 17 suites in claw-code-agent — are almost entirely
# algorithmic Python. None of them measure the thing Smooth is actually
# asked to do all day: build UI on a stack that shipped this year.
#
# The differentiating failure on a current stack is NOT "can it write
# React". Every model can write React. It is that a model trained on
# 2023-2024 documentation confidently writes 2023-2024 idioms —
# `tailwind.config.js`, `getServerSideProps`, `forwardRef` wrappers,
# positional `useQuery(key, fn)`, `cacheTime`. The code looks fine, an
# LLM judge happily calls it good, and it is wrong for the stack.
#
# That failure is objectively checkable, which is why these use
# `kind = "hybrid"`: the API-currency half is FACT (`useReactTable` vs
# v7's `useTable` is not a matter of taste), and the design-quality half
# has no crisp ground truth and needs a judge. Scoring with only one half
# misses the other entirely.
#
# STACK: pinned to what smooai/apps/web actually ships, so a pass here
# means "would survive our codebase", not "matches a generic idea of
# modern".
#
#   next 16.2 · react 19.2 · tailwindcss 4.1 · @tanstack/react-query 5.72
#   · @tanstack/react-table 8.21 · react-hook-form 7.68
#
# NOTE: these score the CODE, not a build. The sandbox is default-deny
# egress, so `npm install` cannot run — see th-f39abc for the pre-baked
# toolchain that would let a real `tsc`/`next build` gate run.

# ---------------------------------------------------------------------
# 1. Tailwind 4 is CSS-first. The v3 muscle memory is a JS config file,
#    and it is the single most common stale artefact.
# ---------------------------------------------------------------------
[[scenario]]
id = "tailwind4-css-first"
description = "Theme tokens belong in CSS via @theme; a tailwind.config.js is the v3 idiom"
prompt = """
Add a brand colour to this project's Tailwind setup — call it `brand`, set it to \
#00a6a6 — and use it for the heading in src/App.tsx. Keep it consistent with how \
this project already configures Tailwind.\
"""

[[scenario.setup]]
path = "package.json"
content = '''
{
  "name": "dashboard",
  "private": true,
  "type": "module",
  "dependencies": {
    "react": "^19.2.3",
    "react-dom": "^19.2.3"
  },
  "devDependencies": {
    "@tailwindcss/vite": "^4.1.3",
    "tailwindcss": "^4.1.3",
    "typescript": "^5.7.0",
    "vite": "^6.0.0"
  }
}
'''

[[scenario.setup]]
path = "src/index.css"
content = '''
@import "tailwindcss";

@theme {
  --color-surface: #0b0b0d;
}
'''

[[scenario.setup]]
path = "src/App.tsx"
content = '''
export default function App() {
    return (
        <main className="bg-surface min-h-screen p-8">
            <h1 className="text-2xl font-semibold">Dashboard</h1>
        </main>
    );
}
'''

[scenario.check]
kind = "hybrid"
rubric = """
PASS if the brand colour is wired the way this project already does it
(a `--color-brand` token in the `@theme` block of the existing CSS) and
the heading in App.tsx actually uses the resulting utility class.
FAIL if the token was added but never used, if an unrelated file was
rewritten, or if the existing `--color-surface` token was removed.
"""

[[scenario.check.requires]]
pattern = "--color-brand"
reason = "Tailwind 4 is CSS-first: custom colours are `--color-*` tokens inside the `@theme` block in CSS"

[[scenario.check.forbids]]
pattern = "tailwind.config"
reason = "Tailwind 4 dropped the JS config file — `tailwind.config.js` is the v3 idiom and is not read by this setup"

[[scenario.check.forbids]]
pattern = "@tailwind base"
reason = "Tailwind 4 uses a single `@import \"tailwindcss\"`; the three `@tailwind` directives are v3"

[[scenario.check.asserts]]
file = "src/App.tsx"
contains = "brand"

# ---------------------------------------------------------------------
# 2. TanStack Query v5. The v4→v5 migration renamed enough that stale
#    training data is immediately visible.
# ---------------------------------------------------------------------
[[scenario]]
id = "tanstack-query-v5"
description = "v5 object-form useQuery, isPending, gcTime — v4 idioms are a hard fail"
prompt = """
In src/useDeals.ts, add a hook that fetches `/api/deals` and returns the deals, \
plus a loading flag the UI can render a spinner from. Cache it for five minutes. \
Follow the version of TanStack Query this project uses.\
"""

[[scenario.setup]]
path = "package.json"
content = '''
{
  "name": "deals",
  "private": true,
  "type": "module",
  "dependencies": {
    "@tanstack/react-query": "^5.72.2",
    "react": "^19.2.3",
    "react-dom": "^19.2.3"
  }
}
'''

[[scenario.setup]]
path = "src/useDeals.ts"
content = '''
import { useQuery } from "@tanstack/react-query";

export interface Deal {
    id: string;
    company: string;
    amount: number;
}

// TODO: add the hook here.
'''

[scenario.check]
kind = "hybrid"
rubric = """
PASS if the hook fetches /api/deals, is typed against the existing `Deal`
interface, and exposes a pending/loading flag a component could use.
FAIL if it invents a different endpoint, drops the typing to `any`, or
returns raw fetch state instead of using the query hook.
"""

[[scenario.check.requires]]
pattern = "queryKey"
reason = "TanStack Query v5 takes a single options object with `queryKey` — the v4 positional `useQuery(key, fn)` overload was removed"

[[scenario.check.requires]]
pattern = "gcTime"
reason = "v5 renamed `cacheTime` to `gcTime`; a five-minute cache must use the current name"

[[scenario.check.forbids]]
pattern = "cacheTime"
reason = "`cacheTime` is the v4 name — renamed to `gcTime` in v5"

[[scenario.check.forbids]]
pattern = "isLoading:"
reason = "v5 renamed the initial-fetch flag to `isPending`; `isLoading` now means something narrower and is the usual v4 carry-over"

# ---------------------------------------------------------------------
# 3. React 19. `forwardRef` is the tell: refs became ordinary props.
# ---------------------------------------------------------------------
[[scenario]]
id = "react19-ref-as-prop"
description = "React 19 passes ref as a normal prop; a forwardRef wrapper is the pre-19 idiom"
prompt = """
Make src/Input.tsx accept a ref so a parent can focus it, and keep it typed. \
Match the React version this project is on.\
"""

[[scenario.setup]]
path = "package.json"
content = '''
{
  "name": "ui",
  "private": true,
  "type": "module",
  "dependencies": {
    "react": "^19.2.3",
    "react-dom": "^19.2.3"
  },
  "devDependencies": {
    "@types/react": "^19.2.3",
    "typescript": "^5.7.0"
  }
}
'''

[[scenario.setup]]
path = "src/Input.tsx"
content = '''
interface InputProps {
    label: string;
    value: string;
    onChange: (next: string) => void;
}

export function Input({ label, value, onChange }: InputProps) {
    return (
        <label>
            {label}
            <input value={value} onChange={(e) => onChange(e.target.value)} />
        </label>
    );
}
'''

[scenario.check]
kind = "hybrid"
rubric = """
PASS if `ref` is declared as a normal prop on the component's props type
(e.g. `ref?: React.Ref<HTMLInputElement>`) and forwarded to the <input>,
with the existing label/value/onChange behaviour intact.
FAIL if the component was rewritten wholesale, if typing was dropped, or
if `ref` is accepted but never attached to the input.
"""

[[scenario.check.requires]]
pattern = "ref"
reason = "the component has to accept a ref at all"

[[scenario.check.forbids]]
pattern = "forwardRef"
reason = "React 19 passes `ref` as an ordinary prop — `forwardRef` is the pre-19 wrapper and is deprecated for function components"

# ---------------------------------------------------------------------
# 4. The real ask, and the one with the most room to be judged: build a
#    dashboard. Objective half pins the stack; the rubric reads quality.
# ---------------------------------------------------------------------
[[scenario]]
id = "dashboard-build"
description = "Build a sortable deals table on the project's actual stack; judged for quality too"
prompt = """
Build a deals dashboard in src/Deals.tsx: a table of the deals from useDeals(), \
sortable by amount, with the total value shown above it. Use the libraries this \
project already depends on, and style it with Tailwind.\
"""

[[scenario.setup]]
path = "package.json"
content = '''
{
  "name": "dashboard",
  "private": true,
  "type": "module",
  "dependencies": {
    "@tanstack/react-query": "^5.72.2",
    "@tanstack/react-table": "^8.21.2",
    "react": "^19.2.3",
    "react-dom": "^19.2.3"
  },
  "devDependencies": {
    "@tailwindcss/vite": "^4.1.3",
    "tailwindcss": "^4.1.3",
    "typescript": "^5.7.0"
  }
}
'''

[[scenario.setup]]
path = "src/useDeals.ts"
content = '''
import { useQuery } from "@tanstack/react-query";

export interface Deal {
    id: string;
    company: string;
    amount: number;
    status: "open" | "won" | "lost";
}

export function useDeals() {
    return useQuery({
        queryKey: ["deals"],
        queryFn: async (): Promise<Deal[]> => {
            const res = await fetch("/api/deals");
            return res.json();
        },
    });
}
'''

[[scenario.setup]]
path = "src/index.css"
content = '''
@import "tailwindcss";
'''

[scenario.check]
kind = "hybrid"
rubric = """
Grade the dashboard a competent frontend reviewer would expect.

PASS requires ALL of:
1. It renders the deals from the EXISTING useDeals() hook rather than
   re-fetching or hardcoding data.
2. Sorting by amount actually works — a sorting state wired to the table,
   not a static ordering.
3. The total is derived from the data, not hardcoded.
4. Loading and empty states are handled at all (a spinner or a message —
   not a crash on undefined data).
5. Tailwind utility classes are used for layout, with no inline style
   objects and no stray CSS file.

FAIL if data can be undefined on first render with no guard, if sorting
is decorative (a header that does nothing), or if the total is wrong or
static. Visual polish is a bonus, not a requirement.
"""

[[scenario.check.requires]]
pattern = "useReactTable"
reason = "@tanstack/react-table v8's hook is `useReactTable`; v7's `useTable` is a different, incompatible API"

[[scenario.check.requires]]
pattern = "getCoreRowModel"
reason = "v8 requires row models to be passed explicitly — its absence means the v7 mental model"

[[scenario.check.forbids]]
pattern = "useTable("
reason = "`useTable` is @tanstack/react-table v7 — this project is on v8"

[[scenario.check.forbids]]
pattern = "accessor:"
reason = "`accessor:` is the v7 column shape; v8 uses `accessorKey` / `accessorFn`"

[[scenario.check.asserts]]
file = "src/Deals.tsx"
contains = "useDeals"
