[package]
name = "smooai-smooth-bigsmooth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Big Smooth — orchestrator, policy generation, API server"

[lib]
name = "smooth_bigsmooth"

[dependencies]
smooth-pearls.workspace = true
smooth-operator.workspace = true
# skills discovery + the smooth cast roles (re-homed from the engine at 0.14.0)
smooth-cast.workspace = true
smooth-code = { path = "../smooth-code", package = "smooai-smooth-code" }
smooth-policy.workspace = true
smooth-web = { path = "../smooth-web", package = "smooai-smooth-web" }
smooth-narc.workspace = true
smooth-scribe.workspace = true
smooth-archivist.workspace = true
smooth-diver.workspace = true
axum = { workspace = true, features = ["ws"] }
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
globwalk.workspace = true
ignore.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dirs-next.workspace = true
# Chat attachments (pearl th-5295a2): base64-decode inbound uploads +
# sha256 content-address for the ~/.smooth/attachments cache. Both are
# already in the lockfile (used by smooth-cli / smooth-policy).
base64 = "0.22"
sha2 = "0.10"
toml.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true

# gRPC (pearl th-893801).
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
# hyper_util TokioIo is needed by the tonic_clients UDS
# adapters (iter-3f). tower + tokio-stream were already in
# normal deps above. Previously hyper-util was dev-only.
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
hyper.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util.workspace = true
urlencoding.workspace = true

[lints]
workspace = true
