[package]
name = "smooai-smooth-menubar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Quarantined macOS platform FFI for Big Smooth (AppKit menu bar + EventKit access requests, via objc2) — the one crate that opts out of the workspace `unsafe_code = \"forbid\"` (pearls th-f7cb98, th-94cc4a)."

[lib]
name = "smooth_menubar"

# QUARANTINE — this crate deliberately does NOT do `[lints] workspace = true`.
# AppKit via objc2 fundamentally requires `unsafe`; isolating it here keeps
# `unsafe_code = "forbid"` on every other crate in the workspace. Only this crate
# may touch raw AppKit, and its whole surface is a few dozen auditable lines.
[lints.rust]
unsafe_code = "allow"
unused_must_use = "deny"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true

[target.'cfg(target_os="macos")'.dependencies]
block2 = "0.6.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-event-kit = { version = "0.3.2", features = [
    "EKEventStore",
    "EKTypes",
    "block2",
    # th-94cc4a (reminders slice): unlike `calendar`, which shells the `ical`
    # CLI, reminders are read and written through EKReminder in-process — `ical`
    # is calendar-only and there is no equivalent CLI worth depending on.
    "EKReminder",
    "EKCalendarItem",
    "EKCalendar",
    "EKObject",
] }
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile.workspace = true
