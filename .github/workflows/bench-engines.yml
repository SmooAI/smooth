# Engine-parity regression gate (pearls th-11284c, th-df7007, th-901bdc).
#
# `operator-serve.sh smoke` reports all five engines PASS — it only checks
# that they LISTEN. Two of them are broken in ways only a real turn finds:
# the TS server completes turns while calling zero tools, and the .NET
# server returns INTERNAL_ERROR on every turn. Booting is not working, so
# this runs actual scenarios.
#
# SCENARIO CHOICE: five, picked for distinct TOOL surfaces rather than
# for difficulty — this gate exists to catch an engine that stopped
# working, not to rank models. Between them they exercise read, search,
# edit, multi-file write, and the negative case (must NOT write):
#
#   discovery-nested-path      list_files + grep + read_file
#   no-over-refusal            read_file + edit_file  (caught the .NET
#                              "reads but never writes" bug, th-93112a)
#   followthrough-three-items  repeated write_file
#   answers-without-editing    tools_forbidden — proves the engine can
#                              decline to write, not just fail to
#   secret-not-propagated      read + write with a redaction assertion
#
# Two scenarios used to cover this, which left 26 of 28 unwatched.
#
# Scheduled rather than per-PR: each run costs real LLM spend and boots
# five servers. A PR that breaks an engine is caught by the next nightly,
# and `workflow_dispatch` is there when you want it sooner.
#
# REQUIRES `smooth-bench agentic --scoreboard`, added in PR #346. If this
# workflow fails at the "run the agentic suite" step with "unexpected
# argument '--scoreboard'", #346 has not landed on the branch being run.
name: Engine Parity

on:
    schedule:
        # 07:00 UTC daily — after the US evening, before the UK morning.
        - cron: '0 7 * * *'
    workflow_dispatch:
        inputs:
            engines:
                description: 'Space-separated engines to run'
                required: false
                default: 'rust go ts python dotnet'

permissions:
    contents: read

jobs:
    parity:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
            ENGINES: ${{ inputs.engines || 'rust go ts python dotnet' }}
            SMOOTH_OPERATOR_REPO: ${{ github.workspace }}/smooth-operator
        steps:
            - uses: actions/checkout@v4
              with:
                  path: smooth

            - name: Check out the engines
              uses: actions/checkout@v4
              with:
                  repository: SmooAI/smooth-operator
                  path: smooth-operator
                  token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: smooth

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - uses: actions/setup-dotnet@v4
              with: { dotnet-version: '9.0.x' }
            - name: Install uv
              run: curl -LsSf https://astral.sh/uv/install.sh | sh

            # The rust engine's LocalServer IS the daemon, spawned as bare
            # `th daemon` (see Engine::boot_command). Nothing else in this job
            # builds it, so without this the rust row is `No such file or
            # directory` — an empty log and a 0% board that reads exactly like
            # a broken engine. It is built BEFORE the credential step because
            # that step resolves the gateway key through `th config`.
            - name: Build th (the rust engine boots via `th daemon`)
              working-directory: smooth
              run: |
                  cargo build --release -p smooai-smooth-cli --bin th
                  echo "$GITHUB_WORKSPACE/smooth/target/release" >> "$GITHUB_PATH"

            - name: Verify th is on PATH
              run: th --version

            # The gateway key comes from `@smooai/config`, not from a copied
            # GitHub secret — the same rule the rest of the monorepo follows.
            # CI holds ONE bootstrap credential (the M2M pair) and reads every
            # value through it, so rotating the gateway key never touches CI.
            #
            # This runs early and fails loudly on purpose. A missing key does
            # NOT look like a missing key: every engine boots fine, scores 0%
            # with zero tool calls, and the baseline check reports five
            # simultaneous REGRESSIONs. That sent two separate investigations
            # after engine bugs that did not exist (th-e73f0d).
            - name: Resolve the gateway key from @smooai/config
              env:
                  SMOOAI_CLIENT_ID: ${{ secrets.SMOOAI_CLIENT_ID }}
                  SMOOAI_CLIENT_SECRET: ${{ secrets.SMOOAI_CLIENT_SECRET }}
              run: |
                  if [ -z "$SMOOAI_CLIENT_ID" ] || [ -z "$SMOOAI_CLIENT_SECRET" ]; then
                      echo "::error::SMOOAI_CLIENT_ID / SMOOAI_CLIENT_SECRET are unset. They are the ONE bootstrap credential this job needs; every other value (including the gateway key) is read from @smooai/config through them. Mint an M2M pair in Org Settings → API Keys and add both to SmooAI/smooth."
                      exit 1
                  fi
                  th auth login --m2m >/dev/null 2>&1 || {
                      echo "::error::th auth login --m2m failed. The M2M pair is set but auth.smoo.ai rejected it — rotate it."
                      exit 1
                  }
                  key=$(th config get smooaiLlmKey --environment=production --m2m 2>/dev/null || true)
                  if [ -z "$key" ]; then
                      echo "::error::@smooai/config returned no value for smooaiLlmKey in production. Without it every engine scores 0% and the baseline check reports five false regressions."
                      exit 1
                  fi
                  # Mask before anything can echo it — including a later failure.
                  echo "::add-mask::$key"
                  code=$(curl -sS -o /dev/null -w '%{http_code}' https://llm.smoo.ai/v1/models \
                      -H "Authorization: Bearer $key")
                  if [ "$code" != "200" ]; then
                      echo "::error::llm.smoo.ai rejected smooaiLlmKey (HTTP $code). The key resolved but is not usable — rotate it rather than reading the engine scores as real."
                      exit 1
                  fi
                  echo "SMOOAI_GATEWAY_KEY=$key" >> "$GITHUB_ENV"
                  echo "gateway key resolved from @smooai/config and accepted (HTTP 200)"

            - name: Run the agentic suite per engine
              id: run
              continue-on-error: true
              working-directory: smooth
              env:
                  # SMOOAI_GATEWAY_KEY comes from the config step above, via $GITHUB_ENV.
                  SMOOAI_GATEWAY_URL: https://llm.smoo.ai/v1
              run: |
                  mkdir -p boards
                  for e in $ENGINES; do
                      echo "::group::engine $e"
                      # An engine that dies must not abort the others — its
                      # missing board is the finding, and the checker treats
                      # absence as not-passing rather than as no-data.
                      cargo run --release -p smooai-smooth-bench -- agentic \
                          --engine "$e" --isolation host \
                          --only discovery-nested-path --only no-over-refusal \
                          --only followthrough-three-items --only answers-without-editing \
                          --only secret-not-propagated \
                          --model deepseek-v4-flash \
                          --boot-timeout-s 300 \
                          --scoreboard "boards/board-$e.json" || echo "engine $e failed to produce a board"
                      echo "::endgroup::"
                  done

            - name: Check against the baseline
              working-directory: smooth
              run: bash scripts/the-line/check-engine-parity.sh boards docs/engine-baseline.json

            - name: Upload boards and engine logs
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: engine-parity
                  path: |
                      smooth/boards/
                      ~/.smooth/bench-runs/**/log/*.log
                  if-no-files-found: warn
                  retention-days: 14
