# SmoothFlow (apps/smoothflow) — the native macOS fleet console.
#
# pull_request: compile gate + XCTests, ad-hoc signed, nothing published.
# The signed + notarized + published release is smoothflow-publish.yml.
name: smoothflow-mac

on:
    pull_request:
        paths:
            - 'apps/smoothflow/**'
            - '.github/workflows/smoothflow-mac.yml'

concurrency:
    group: smoothflow-mac-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: macos-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v4

            - name: Tools
              run: brew install xcodegen

            - name: GhosttyKit (pinned prebuilt)
              run: bash apps/smoothflow/scripts/ensure-ghosttykit.sh

            - name: Generate project
              working-directory: apps/smoothflow
              run: xcodegen generate

            - name: Build + test (ad-hoc)
              working-directory: apps/smoothflow
              run: |
                  set -o pipefail
                  xcodebuild -project SmoothFlow.xcodeproj -scheme SmoothFlow -configuration Debug \
                      -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- test 2>&1 \
                      | grep -E "error:|warning: .*Swift|Test Case.*failed|Executed|BUILD|TEST" || true
                  xcodebuild -project SmoothFlow.xcodeproj -scheme SmoothFlow -configuration Debug \
                      -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY=- test -quiet
