name: The Line

# Runs `smooth-bench score --release` on every release tag (`v*`), publishes
# the result to:
#   - $GITHUB_STEP_SUMMARY (Actions UI)
#   - docs/bench-history.md (append one row, commit to main with [skip ci])
#   - docs/bench-latest.json (raw score, consumed by README badge)
#   - The GitHub Release body (replace <!-- THE-LINE --> or append)
#
# Fails with exit 1 if this release's overall_pass_rate drops by more than
# 2 percentage points vs the previous row in docs/bench-history.md. That is
# the regression alarm — a human must investigate before the release goes
# public.
#
# The `workflow_dispatch` `dry_run` input is the primary test surface: it
# skips the (expensive, network-bound) smooth-bench step and feeds a checked
# in fixture through every downstream step. The regression-fixture variant
# lets you verify the alarm trips as expected.

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry-run: use fixture JSON instead of running smooth-bench'
                type: boolean
                default: true
            fixture:
                description: 'Fixture to use when dry_run=true'
                type: choice
                options:
                    - sample
                    - regression
                default: sample
            tag_override:
                description: 'Tag name to use when dry_run=true (default: v0.0.0-dry-run)'
                type: string
                default: v0.0.0-dry-run

concurrency:
    group: the-line
    cancel-in-progress: false

permissions:
    contents: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    the-line:
        name: Publish The Line
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && '1' || '0' }}
            TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_override }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

            - name: Install jq
              run: |
                  if ! command -v jq >/dev/null 2>&1; then
                      sudo apt-get update
                      sudo apt-get install -y jq
                  fi

            - name: Run helper-script test harness
              if: env.DRY_RUN == '1'
              run: bash scripts/the-line/test.sh

            - name: Setup Rust toolchain
              if: env.DRY_RUN != '1'
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              if: env.DRY_RUN != '1'
              uses: Swatinem/rust-cache@v2
              with:
                  cache-on-failure: true

            - name: Install Linux build deps
              if: env.DRY_RUN != '1'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libdbus-1-dev libcap-ng-dev protobuf-compiler

            - name: Build smooth-bench and th
              if: env.DRY_RUN != '1'
              # th is built here because the credential step below reads the
              # gateway key out of @smooai/config rather than a GitHub secret.
              run: |
                  cargo build --release -p smooai-smooth-bench
                  cargo build --release -p smooai-smooth-cli --bin th

            # Two bugs lived here. The secret referenced below never existed,
            # AND it was spelled SMOOAI_GATEWAY_API_KEY while smooth-bench reads
            # SMOOAI_GATEWAY_KEY — so The Line would have scored keyless even
            # with the secret set. `score` only *warns* on a missing key and
            # then reports every scenario as failing, which is indistinguishable
            # from a real regression. Fail here instead.
            - name: Resolve the gateway key from @smooai/config
              if: env.DRY_RUN != '1'
              env:
                  SMOOAI_CLIENT_ID: ${{ secrets.SMOOAI_CLIENT_ID }}
                  SMOOAI_CLIENT_SECRET: ${{ secrets.SMOOAI_CLIENT_SECRET }}
              run: |
                  export PATH="$PWD/target/release:$PATH"
                  if [ -z "$SMOOAI_CLIENT_ID" ] || [ -z "$SMOOAI_CLIENT_SECRET" ]; then
                      echo "::error::SMOOAI_CLIENT_ID / SMOOAI_CLIENT_SECRET are unset. They are the ONE bootstrap credential this job needs; the gateway key is read from @smooai/config through them."
                      exit 1
                  fi
                  th auth login --m2m >/dev/null 2>&1 || {
                      echo "::error::th auth login --m2m failed — rotate the M2M pair."
                      exit 1
                  }
                  key=$(th config get smooaiLlmKey --environment=production --m2m 2>/dev/null || true)
                  if [ -z "$key" ]; then
                      echo "::error::@smooai/config returned no value for smooaiLlmKey in production. Every scenario would fail and read as a regression."
                      exit 1
                  fi
                  echo "::add-mask::$key"
                  code=$(curl -sS -o /dev/null -w '%{http_code}' https://llm.smoo.ai/v1/models \
                      -H "Authorization: Bearer $key")
                  if [ "$code" != "200" ]; then
                      echo "::error::llm.smoo.ai rejected smooaiLlmKey (HTTP $code) — rotate it rather than reading the score as real."
                      exit 1
                  fi
                  echo "SMOOAI_GATEWAY_KEY=$key" >> "$GITHUB_ENV"
                  echo "SMOOAI_GATEWAY_URL=https://llm.smoo.ai/v1" >> "$GITHUB_ENV"
                  echo "gateway key resolved from @smooai/config and accepted (HTTP 200)"

            - name: Run smooth-bench score --release
              if: env.DRY_RUN != '1'
              # SMOOAI_GATEWAY_KEY / _URL come from the config step above, via
              # $GITHUB_ENV — and under the names smooth-bench actually reads.
              run: |
                  set -o pipefail
                  ./target/release/smooth-bench score \
                      --release \
                      --budget-usd 10 \
                      --output score.json
                  echo "smooth-bench exit=$?"

            - name: Seed score.json from fixture (dry-run only)
              if: env.DRY_RUN == '1'
              run: |
                  fixture="${{ inputs.fixture }}"
                  case "$fixture" in
                      regression) src=tests/fixtures/the-line-regression.json ;;
                      sample|*)   src=tests/fixtures/the-line-sample.json ;;
                  esac
                  cp "$src" score.json
                  echo "seeded score.json from $src"

            - name: Render markdown summary + history row
              run: |
                  mkdir -p artifacts
                  SUMMARY_OUT=artifacts/summary.md \
                  HISTORY_ROW_OUT=artifacts/row.md \
                      bash scripts/the-line/render-markdown.sh score.json "$TAG"
                  cat artifacts/summary.md >>"$GITHUB_STEP_SUMMARY"

            - name: Check regression vs previous release
              run: bash scripts/the-line/check-regression.sh score.json docs/bench-history.md

            - name: Append to docs/bench-history.md
              run: bash scripts/the-line/append-history.sh docs/bench-history.md artifacts/row.md

            - name: Copy score to docs/bench-latest.json
              run: cp score.json docs/bench-latest.json

            - name: Render docs/bench-badge.json (Shields.io endpoint)
              run: bash scripts/the-line/render-badge.sh score.json docs/bench-badge.json

            - name: Commit history + latest score to main
              if: env.DRY_RUN != '1'
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "smoo-ai-bot"
                  git config user.email "bot@smoo.ai"
                  git fetch origin main
                  git checkout main
                  # Re-apply the two artifact changes on top of main (the tag
                  # checkout above may be at a detached HEAD on a historical
                  # commit). We only commit the two files we own.
                  SUMMARY_OUT=artifacts/summary.md \
                  HISTORY_ROW_OUT=artifacts/row.md \
                      bash scripts/the-line/render-markdown.sh score.json "$TAG"
                  bash scripts/the-line/append-history.sh docs/bench-history.md artifacts/row.md
                  cp score.json docs/bench-latest.json
                  bash scripts/the-line/render-badge.sh score.json docs/bench-badge.json
                  git add docs/bench-history.md docs/bench-latest.json docs/bench-badge.json
                  if git diff --cached --quiet; then
                      echo "no changes to commit (history already updated for this tag?)"
                  else
                      git commit -m "chore(the-line): publish $TAG bench score [skip ci]"
                      git push origin main
                  fi

            - name: Build release-notes.md with embedded summary
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bash scripts/the-line/update-release-notes.sh artifacts/summary.md "$TAG" artifacts/release-notes.md

            - name: Update GitHub Release body
              if: env.DRY_RUN != '1'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$TAG" --notes-file artifacts/release-notes.md

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: the-line-${{ env.TAG }}
                  path: |
                      score.json
                      artifacts/summary.md
                      artifacts/row.md
                      artifacts/release-notes.md
                  if-no-files-found: warn
