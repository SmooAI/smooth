# xcodegen spec — `xcodegen generate` writes SmoothFlow.xcodeproj (gitignored).
# Everything reviewable about the Xcode project lives here.
name: SmoothFlow
options:
    bundleIdPrefix: ai.smoo
    deploymentTarget:
        macOS: '14.0'
    xcodeVersion: '16.0'
    createIntermediateGroups: true
    generateEmptyDirectories: true

settings:
    base:
        SWIFT_VERSION: '5.10'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        DEVELOPMENT_TEAM: DTX9733844
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
        SWIFT_INCLUDE_PATHS: '$(SRCROOT)/Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/Headers'
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/Headers'

packages:
    # OTA updates. The package also ships bin/generate_appcast + generate_keys under
    # build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin — the release
    # workflow uses those, so the tools and the framework are always the same version.
    Sparkle:
        url: https://github.com/sparkle-project/Sparkle
        exactVersion: 2.9.6

targets:
    SmoothFlow:
        type: application
        platform: macOS
        sources:
            - path: Sources
            # Files (not a folder reference): a folder reference copies the
            # directory itself, so the .icns lands at Contents/Resources/Resources/
            # and CFBundleIconFile never resolves.
            - path: Resources
              buildPhase: resources
              excludes: [README.txt]
            - path: LaunchAgents
              buildPhase:
                  copyFiles:
                      destination: wrapper
                      subpath: Contents/Library/LaunchAgents
        dependencies:
            - package: Sparkle
            - sdk: Metal.framework
            - sdk: QuartzCore.framework
            - sdk: CoreText.framework
            - sdk: Carbon.framework
            - sdk: IOSurface.framework
            - sdk: CoreVideo.framework
            - sdk: EventKit.framework
            - sdk: UserNotifications.framework
            - sdk: ServiceManagement.framework
        preBuildScripts:
            - name: Ensure GhosttyKit
              script: bash "$SRCROOT/scripts/ensure-ghosttykit.sh"
              basedOnDependencyAnalysis: false
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: ai.smoo.smoothflow
                PRODUCT_NAME: SmoothFlow
                INFOPLIST_FILE: Info.plist
                GENERATE_INFOPLIST_FILE: NO
                ENABLE_HARDENED_RUNTIME: YES
                CODE_SIGN_ENTITLEMENTS: entitlements.plist
                CODE_SIGN_STYLE: Manual
                # GhosttyKit is linked as the raw static archive, not as an xcframework
                # dependency: Xcode's package-enabled build description rejects the
                # fork's xcframework ("There is no XCFramework found at") the moment a
                # SwiftPM package (Sparkle) is in the project. Module paths are
                # project-level (the test target imports the app module).
                OTHER_LDFLAGS: ['-lc++', '$(SRCROOT)/Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/ghostty-internal.a']
                SWIFT_OBJC_BRIDGING_HEADER: ''
                ENABLE_USER_SCRIPT_SANDBOXING: NO
                ASSETCATALOG_COMPILER_APPICON_NAME: ''
            configs:
                Debug:
                    # Ad-hoc: enough for local runs and TCC prompts (a real bundle
                    # is what TCC keys on; the identity is not).
                    CODE_SIGN_IDENTITY: '-'
                Release:
                    # Overridden by scripts/build-release.sh (SIGN_IDENTITY).
                    CODE_SIGN_IDENTITY: 'Developer ID Application'
    SmoothFlowTests:
        type: bundle.unit-test
        platform: macOS
        sources:
            - path: Tests
        dependencies:
            - target: SmoothFlow
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: ai.smoo.smoothflow.tests
                GENERATE_INFOPLIST_FILE: YES
                CODE_SIGN_IDENTITY: '-'
                CODE_SIGN_STYLE: Manual
                TEST_HOST: '$(BUILT_PRODUCTS_DIR)/SmoothFlow.app/Contents/MacOS/SmoothFlow'
                BUNDLE_LOADER: '$(TEST_HOST)'

    # XCUITest lane (pearl th-a58a97): drives the built app against the mock
    # server and against the real engine (flow_e2e_server + fake-claude).
    # See docs/Engineering/SmoothFlow-Testing-macOS.md.
    SmoothFlowUITests:
        type: bundle.ui-testing
        platform: macOS
        sources:
            - path: UITests
        dependencies:
            - target: SmoothFlow
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: ai.smoo.smoothflow.uitests
                GENERATE_INFOPLIST_FILE: YES
                CODE_SIGN_IDENTITY: '-'
                CODE_SIGN_STYLE: Manual
                TEST_TARGET_NAME: SmoothFlow
                # Xcode sandboxes xctrunner by default (container HOME, no tmux
                # sockets, no writable temp dirs). The tests spawn node / tmux /
                # flow_e2e_server, so the runner must be a plain process.
                ENABLE_APP_SANDBOX: NO
                CODE_SIGN_ENTITLEMENTS: UITests/SmoothFlowUITests.entitlements

schemes:
    SmoothFlow:
        build:
            targets:
                SmoothFlow: all
                SmoothFlowTests: [test]
                SmoothFlowUITests: [test]
        run:
            config: Debug
        test:
            config: Debug
            targets:
                - SmoothFlowTests
                - SmoothFlowUITests
        archive:
            config: Release
