[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.23.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/SmooAI/smooth"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Database — `smooth-daemon`'s durable local storage (schedules, operator
# state). `bundled` compiles SQLite into the binary, so there is no system
# `sqlite3` to match. rusqlite is the only crate in the tree that links it
# (`cargo tree -i libsqlite3-sys`); the old 0.32 pin existed to unify with
# microsandbox's sea-orm → sqlx → libsqlite3-sys 0.30, and died with the
# microVM stack (2026-07, pearl th-f4a801).
rusqlite = { version = "0.40", features = ["bundled"] }
# SMOODEV-1468: sync Postgres checkpoint store (smooth-operator `postgres` feature)
# + testcontainers-backed integration tests. Sync `postgres` crate (not async
# sqlx) because the CheckpointStore trait is synchronous, mirroring rusqlite.
postgres = "0.19"
r2d2 = "0.8"
r2d2_postgres = "0.18"
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["postgres"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# Markdown
pulldown-cmark = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML — used for skills/SKILL.md frontmatter parsing (pearl
# th-e0f812). serde_yml is the maintained fork of serde_yaml.
serde_yml = "0.0.12"

# HTTP client
# Use rustls-tls-webpki-roots so the crate ships its own CA bundle rather than
# reading the system trust store — `th` is distributed as a standalone binary
# and must work on hosts with no `ca-certificates` installed.
#
# `hickory-dns` swaps getaddrinfo for a pure-Rust resolver that reads
# /etc/resolv.conf and sends UDP queries itself. Originally needed because
# alpine musl's getaddrinfo returned EAI_AGAIN against the microVM's
# intercepted DNS (that stack is gone, 2026-07/th-f4a801); kept because it
# keeps resolution independent of the host's libc and NSS config.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots", "charset", "http2", "hickory-dns"] }

# File search
globwalk = "0.9"
ignore = "0.4"

# In-process ripgrep — the library crates behind `rg`. Powers the native
# GrepTool so the agent can search code without shelling out.
grep-regex = "0.1"
grep-searcher = "0.1"

# Fuzzy matching (nucleo — used by Helix/Zed editors). Powers "did you
# mean?" suggestions when the agent misspells a file path.
nucleo-matcher = "0.3"

# Diff generation + patch application. `similar` generates unified diffs
# for tool result metadata; `patch` parses and applies unified .patch
# files for the apply_patch tool.
similar = "2"

# LSP client types — JSON-RPC message structures for communicating with
# language servers (rust-analyzer, typescript-language-server, pyright).
lsp-types = "0.97"

# Model Context Protocol SDK — the official Rust MCP client/server
# library. We use it client-side to spawn user-configured MCP servers
# (Playwright, GitHub, etc.) as subprocesses and bridge their tools
# into the runner's ToolRegistry.
rmcp = { version = "1.4", features = ["client", "transport-child-process"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone db — `th booking slots` renders slot times in the org's
# configured timezone (chrono alone only knows fixed offsets / UTC).
chrono-tz = "0.10"
futures-core = "0.3"
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
dirs-next = "2"
urlencoding = "2"
tempfile = "3"
fs4 = "0.13"

# Embed web assets
rust-embed = "8"

# TOML + glob
toml = "0.8"
globset = "0.4"

# Proxy
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"

# Hot-reload
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
arc-swap = "1"

# Colors
owo-colors = "4"

# Progress / spinners (boot indicator, long-running commands)
indicatif = "0.17"

# TTY detection
atty = "0.2"

# Async streams
async-trait = "0.1"
tokio-stream = { version = "0.1", features = ["sync"] }
pin-project-lite = "0.2"

# WebSocket client
tokio-tungstenite = "0.26"

# gRPC stack for in-VM IPC (pearl th-893801). Pinned to current
# stable versions; tonic-build runs in each gRPC-serving crate's
# build.rs to codegen from proto/.
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Published agent engine (crates.io: smooai-smooth-operator-core).
# SMOODEV-1787 (PR 1/4, dual-engine collapse): smooth consumes the public
# `smooai-smooth-operator-core` engine instead of an in-tree copy. The in-tree
# `crates/smooth-operator` copy was deleted. The dep KEY stays `smooth-operator`
# and the lib is package-aliased back to `smooth_operator`, so the ~12 consumers'
# `use smooth_operator::…` imports for the GENERIC engine API keep working
# unchanged.
#
# SMOODEV-1790 (PR 4/4, final cutover): switched from the rev-pinned git dep on
# the OLD engine (rev bb9a256, which still carried the th-code harness) to the
# published crates.io release `0.14.0` — a clean GENERIC engine with the harness
# REMOVED. The harness bits the engine dropped (the coding workflow, skill
# discovery, and the fixer/oracle/chief/intent_classifier cast roles) now live
# in the smooth-owned `smooth-cast` crate below, built on the engine's generic
# public API.
#
# SEP Phase 3 (th-f288ae): the SEP extension module (host/process/protocol +
# ui_capabilities handshake, Phases 0–3) lives on core `main` but is NOT yet in a
# crates.io release (the release train only bumped the TS package). Pin the git
# rev that carries it until a version bump publishes extensions; then flip back to
# a `version = "…"` release. Matches the SMOODEV-1787 git-rev precedent.
#
# Multimodal (th-25ce5c / epic th-3be564): this rev is the `multimodal-content-model`
# BRANCH head — `ee648d1` (engine main release #53) + the two multimodal commits
# (Message.images / image_url wire, and AgentConfig::with_user_images). It is
# deliberately NOT a core-`main` rev: core main also carries th-10eb50 (the
# `post_call` redaction-seam signature change) which smooth-narc/smooth-scribe have
# not yet consumed. Pinning the side branch gets multimodal WITHOUT forcing that
# unrelated break. The multimodal commits are ALSO merged to core main (PRs #58/#62)
# — flip this to a core-main rev once smooth absorbs th-10eb50. Keep the
# `multimodal-content-model` remote branch alive until then (it anchors this rev).
# Engine on core 0.16.2 (crates.io). The chat-first Big Smooth daemon runs on
# smooth-operator-server @ 9db9d319 (th-daemon-denypolicy: the branch built
# against published core 1.7.0 AND carrying the `tool_hooks` builder seam on
# LocalServer) — so the whole repo pins 1.7.0 to keep one core version across the
# graph. Core 1.7.0 ships the permission system (`permission::PermissionHook`,
# `AutoMode`, `Verdict`) + `DenyPolicy` circuit-breaker tier, so the daemon
# installs the engine's PermissionHook (Bypass + a declarative DenyPolicy) as its
# first tool_hook and retires the duplicate in-daemon AutoModeHook. narc still
# re-homes as the second ToolHook via the same `.tool_hooks(…)` seam.
smooth-operator = { version = "1.7.0", package = "smooai-smooth-operator-core" }
smooth-operator-server = { git = "https://github.com/SmooAI/smooth-operator.git", rev = "9db9d319287e2ebcd3ab027e39971a0f51ef5b67", package = "smooai-smooth-operator-server", default-features = false }
smooth-operator-svc = { git = "https://github.com/SmooAI/smooth-operator.git", rev = "9db9d319287e2ebcd3ab027e39971a0f51ef5b67", package = "smooai-smooth-operator", default-features = false }
# smooth-owned coding-harness extensions to the generic engine (re-homed from
# the engine when it went generic at 0.14.0). See crates/smooth-cast.
smooth-cast = { version = "0.23.1", path = "crates/smooth-cast", package = "smooai-smooth-cast" }
smooth-policy = { path = "crates/smooth-policy", version = "0.23.1", package = "smooai-smooth-policy" }
smooth-web = { version = "0.23.1", path = "crates/smooth-web", package = "smooai-smooth-web" }
smooth-code = { version = "0.23.1", path = "crates/smooth-code", package = "smooai-smooth-code" }
smooth-pearls = { path = "crates/smooth-pearls", version = "0.23.1", package = "smooai-smooth-pearls" }
smooth-diver = { version = "0.23.1", path = "crates/smooth-diver", package = "smooai-smooth-diver" }
smooth-tmux = { version = "0.23.1", path = "crates/smooth-tmux", package = "smooai-smooth-tmux" }
smooth-api-client = { version = "0.23.1", path = "crates/smooth-api-client", package = "smooai-smooth-api-client" }
# Chat-first Big Smooth daemon on the smooth-operator LocalServer engine (th-7225f9).
smooth-daemon = { version = "0.23.1", path = "crates/smooth-daemon", package = "smooai-smooth-daemon" }
smooth-tools = { version = "0.23.1", path = "crates/smooth-tools", package = "smooai-smooth-tools" }
smooth-goalie = { version = "0.23.1", path = "crates/smooth-goalie", package = "smooai-smooth-goalie" }
# Cross-runtime client shared library (github.com/SmooAI/client-shared).
# SMOODEV-1464: switched from a local `path = "../client-shared/rust"` dep to
# a rev-pinned git dep. The path form only resolved on a dev laptop, so every
# CI release since v0.13.7 failed at `cargo metadata` ("failed to load manifest
# for workspace member crates/smooth-cli") — surfaced misleadingly as the
# "Format check" step. Rev-pinned (not branch) for reproducible release builds;
# bump the rev when client-shared changes.
# Pearls: th-33d57b (scaffolded), th-0398c1 (auth module),
# th-abc4e2 (wires `th admin login`).
smooai-client-shared = { git = "https://github.com/SmooAI/client-shared.git", rev = "a21c06b6ebd94a63b22f6637b3b239b0c6f212a3", features = ["auth"] }

# The house HTTP client — resilient reqwest wrapper (retries, timeout,
# rate-limit, circuit breaker). The tunnel's local-target proxy uses it
# instead of raw reqwest. Rev-pinned like client-shared; the crate lives
# in the `rust/fetch/` subdir of the repo (cargo discovers it). Pearl
# th-e82dac.
smooai-fetch = { git = "https://github.com/SmooAI/fetch.git", rev = "238f63eed71155e92f33eb548ee7e862b41e5aa2" }
